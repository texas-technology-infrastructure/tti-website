    <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-200%" y="-200%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
